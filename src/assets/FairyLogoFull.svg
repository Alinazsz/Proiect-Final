<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C7F1"/>
      <stop offset="50%" stop-color="#CDE7F7"/>
      <stop offset="100%" stop-color="#D6F5E3"/>
    </linearGradient>

    <linearGradient id="bookmarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7CDE2"/>
      <stop offset="100%" stop-color="#EFA5B6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.78
                0 0 0 0 0.95
                0 0 0 0.6 0"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#EFA5B6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wing glow -->
  <g filter="url(#glow)">
    <ellipse cx="70" cy="90" rx="32" ry="26" fill="#D9C7F1" fill-opacity="0.4"/>
  </g>

  <!-- Fairy wing -->
  <path d="M70 90
           C45 80, 40 55, 55 45
           C70 35, 90 40, 92 60
           C80 60, 75 72, 70 90Z"
        fill="url(#wingGrad)"
        fill-opacity="0.9"
        stroke="#A06BA7"
        stroke-width="2"/>

  <!-- Wing swirl -->
  <path d="M68 82
           C58 76, 56 64, 64 58"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.8"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Bookmark -->
  <g filter="url(#shadow)">
    <rect x="82" y="40" width="36" height="96" rx="10"
          fill="url(#bookmarkGrad)"
          stroke="#A06BA7"
          stroke-width="2"/>
  </g>

  <!-- Heart cutout -->
  <path d="M100 54
           C98 51, 94 50, 92 52
           C90 54, 90 57, 92 59
           L100 66
           L108 59
           C110 57, 110 54, 108 52
           C106 50, 102 51, 100 54Z"
        fill="#FFF7F0"/>

  <!-- Ribbon tail -->
  <path d="M82 136
           L100 126
           L118 136
           L118 140
           L82 140Z"
        fill="#EFA5B6"
        stroke="#A06BA7"
        stroke-width="1.5"/>

  <!-- Sparkles -->
  <circle cx="120" cy="32" r="3" fill="#F2D28B"/>
  <circle cx="88" cy="26" r="2.4" fill="#F2D28B"/>
  <circle cx="108" cy="18" r="2.2" fill="#F2D28B"/>

  <!-- Star -->
  <polygon points="100,20 103,25 109,26 104,29 103,35 100,30 95,29 98,26"
           fill="#F2D28B"/>
</svg>
